[platformio]
default_envs = heltec-v3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2
  rweather/Crypto@0.4.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_ldf_mode = deep+

[env:heltec-v3]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
board_build.partitions = partitions/heltec.csv
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@1.4.3
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
build_flags = ${env.build_flags} -DMESHIT_ESP32 -DMESHIT_HAS_OLED -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
extra_scripts =
  pre:tools/embed_web.py
  post:tools/export_flash_layout.py

; OLED V4.2 (GC1109) and V4.3 (KCT8103L) require different FEM control.
[env:heltec-v4]
extends = env:heltec-v3
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions/heltec-v4.csv
build_flags = ${env:heltec-v3.build_flags} -DMESHIT_HELTEC_V4 -DARDUINO_USB_CDC_ON_BOOT=1

[env:heltec-v4-3]
extends = env:heltec-v4
build_flags = ${env:heltec-v4.build_flags} -DMESHIT_HELTEC_V4_KCT8103L

[nrf52]
platform = nordicnrf52@10.11.0
board = adafruit_feather_nrf52840
platform_packages = framework-arduinoadafruitnrf52@1.10700.0
board_build.variant = variant
board_build.variants_dir = firmware/nrf52
board_build.ldscript = firmware/nrf52/app.ld
board_build.softdevice.sd_version = 7.3.0
board_build.softdevice.sd_fwid = 0x0123
board_build.usb_product = meshit
board_upload.maximum_size = 364544
board_upload.maximum_ram_size = 229376
extra_scripts =
  pre:tools/nrf_build.py
  pre:tools/embed_web.py
build_flags = ${env.build_flags} -DMESHIT_NRF52 -DNRF52840_XXAA -DCFG_DEBUG=0 -Wno-psabi

[env:rak4631]
extends = nrf52

[env:rak4631-s140-6-1-1]
extends = nrf52
board_build.softdevice.sd_version = 6.1.1
board_build.softdevice.sd_fwid = 0x00B6
board_build.ldscript = firmware/nrf52/app-s140-6.ld
board_upload.maximum_size = 368640

[env:heltec-t114]
extends = nrf52
build_flags = ${nrf52.build_flags} -DMESHIT_NRF_T114
