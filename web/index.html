<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10251e"><title>Meshit</title><script>
try{const theme=localStorage.getItem('meshit.theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;}catch{}
</script><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="#chat"><span class="mark" aria-hidden="true">💩</span> meshit</a><nav><button id="chat-tab" aria-current="page">Chat</button><button id="settings-tab">Settings</button><button id="theme-toggle" aria-label="Dark mode" aria-pressed="false">Dark mode</button></nav></header>
<div id="notice" role="status" aria-live="polite"></div>
<main id="chat-view" class="shell" hidden>
  <aside><div class="aside-title"><h2>Rooms</h2><button id="new-room" class="quiet" aria-label="New room">＋ New room</button></div><div id="rooms"></div><p id="connection" class="connection">Connecting…</p></aside>
  <section class="conversation"><div class="conversation-title"><h1 id="room-title">general</h1><div class="segmented" aria-label="Sort messages"><button id="sort-new" aria-pressed="true">New</button><button id="sort-top" aria-pressed="false">Top</button></div></div>
    <form id="compose"><label id="compose-label" for="message">Message</label><div id="reply-context" hidden></div><textarea id="message" rows="3" placeholder="Message…" required></textarea><div class="composer-footer"><span id="char-count">0 / 160</span><div><button type="button" id="cancel-reply" class="quiet" hidden>Cancel reply</button><button type="submit" id="send" class="primary">Post</button></div></div></form>
    <div id="feed"></div>
  </section>
</main>
<main id="settings-view" class="settings" hidden><h1>Settings</h1>
  <section class="settings-card"><h2>Your radio</h2><p id="radio-info"></p><label>Connection<select id="transport"><option value="local">This radio / local Wi-Fi</option><option value="wifi">Another radio on Wi-Fi</option><option value="ble">Bluetooth</option></select></label><label id="address-label" hidden>Radio address<input id="address" type="url" placeholder="http://meshit.local"></label><button id="connect" class="secondary">Connect</button></section>
  <form id="settings-form"><section class="settings-card"><h2>Identity</h2><label>Nickname <span class="hint">optional · 16 UTF-8 bytes</span><input id="nickname" placeholder="Anonymous" autocomplete="nickname"></label></section>
    <section class="settings-card"><h2>Network</h2><div class="network-options"><label><input type="radio" name="network" value="meshtastic"> Meshtastic</label><label><input type="radio" name="network" value="meshcore"> MeshCore</label></div><label>Region<select id="region"></select></label><label>Preset<select id="preset"></select></label><p id="preset-detail" class="hint"></p><label id="channel-label">Transport channel name<input id="channel" value="LongFast" maxlength="32"></label><p class="hint">Changing network or preset clears radio history.</p></section>
    <section id="wifi-settings" class="settings-card"><h2>Local Wi-Fi</h2><label>Network name<input id="ssid" autocomplete="off"></label><label>Password<input id="password" type="password" autocomplete="new-password" placeholder="Leave blank to keep saved password"></label></section>
    <button class="primary" type="submit">Save settings</button>
  </form>
</main>
<dialog id="onboarding"><form id="setup-form"><h1>Set up radio</h1><div id="setup-networks" class="network-options"><label><input type="radio" name="setup-network" value="meshtastic" required> Meshtastic</label><label><input type="radio" name="setup-network" value="meshcore"> MeshCore</label></div><div id="setup-options" hidden><label>Region<select id="setup-region"></select></label><label>Preset<select id="setup-preset"></select></label><p id="setup-detail" class="hint"></p></div><button class="primary" type="submit">Connect</button></form><button type="button" id="setup-connect" class="quiet">Connect to another radio</button></dialog>
<dialog id="room-dialog"><form id="room-form"><h2>New room</h2><label>Room name<input id="room-name" required placeholder="campfire" autocomplete="off"></label><p class="hint">Up to 16 UTF-8 bytes.</p><div class="actions"><button type="button" id="room-cancel" class="quiet">Cancel</button><button class="primary" type="submit">Create room</button></div></form></dialog>
<script type="module" src="/app.js"></script>
</body></html>
